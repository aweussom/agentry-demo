# Project settings for the xkcd demo. No secrets here; keys and providers are
# in keys.ini at the root. Paths are relative to this folder.
[prosjekt]
navn = xkcd, redrawn
# Default provider for `new` and `fix`, section names from keys.ini.
# agentry: codex backend on the ChatGPT subscription (gpt-image-2, up to 5
# references, about 3 minutes per image). grok-agentry: Grok Build on
# SuperGrok (at most 3 references, 20 to 30 s, used for the film). Both are
# agentry on localhost, no API key. `openai` / `openai-images` work too if
# there is a key in keys.ini.
provider = agentry
fix_provider = agentry
# Canon per provider type. The Responses path gets the long one (an LLM
# filters), the direct path gets the short one (text goes straight to the
# image model). "### Name" sections are sent only for the cast in the draft.
canon_responses = PROMPT.md, VISUAL_CANON.md
canon_direct = IMAGE_CANON.md
# Per-provider override: Grok drifts to photoreal and needs the look spelled
# out and repeated, so it gets its own canon (used with `new --panels`).
canon_grok-agentry = IMAGE_CANON_GROK.md
# Panel size for `new --panels`; Grok returns the aspect, not the pixels.
panel_size = 1536x1024
# Finished strips as style references. Add one or two when approved.
examples =
# Post-processing in `approve`: header on top, white border around.
header = assets/header.png
border = 24
out_width =
# Credit footer drawn with Pillow under every approved strip, formatted with
# the draft frontmatter. CC BY-NC asks for author, title, source, licence and
# a note that this is an adaptation. Font and size are optional.
credit = after xkcd #{nr} "{tittel}" by Randall Munroe, xkcd.com/{nr}, CC BY-NC 2.5. Redrawn as a webtoon; not the original.
credit_font = C:/Windows/Fonts/segoeui.ttf
credit_size =

# Film (video.py). Script in video/<slug>.md, see VIDEO-NOTAT.md at the root.
[video]
provider = grok-agentry
# Clips: same as provider unless set. grok-video = xAI API direct, per second.
#clip_provider = grok-video
# Empty rooms as location templates; the key is what follows "Rom:" in the
# script. Made with Grok image_gen, figures removed, like kona's rom-*.jpg.
rom_soverom = assets/video/rom-soverom.jpg
# intro.mp4 and outro.mp4 are built by `video.py felles` from these.
intro = assets/video/intro.mp4
outro = assets/video/outro.mp4
plakat = assets/video/plakat.png
outro_bilde = assets/video/outro.png
intro_sekunder = 3
outro_sekunder = 5
outro_tekst = after xkcd #162 "Angular Momentum" by Randall Munroe, CC BY-NC 2.5 | redrawn with agentry: no API key, one subscription | github.com/aweussom/agentry
tekst_font = C:/Windows/Fonts/Inkfree.ttf
# Character descriptions appended to the prompt for whoever is in the shot:
# identity only. Clothes per film go in the script frontmatter as tillegg_<name>.
beskriv_cueball = Cueball: the bald man from the card, clean-shaven head, dark eyebrows, slim, late twenties
beskriv_megan = Megan: the woman from the card, dark brown chin-length bob with a side parting, slim, late twenties
