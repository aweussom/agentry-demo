# keys.ini for agentry-demo. No secrets in here: everything goes through
# agentry on localhost, which uses the CLI you logged into (codex or grok).
# This file only says which section means what, and where agentry lives.
# keys.ini.template is the full version with the OpenAI and xAI API
# sections, if you ever want to pay per image instead.

[comic]
project = xkcd
provider = agentry
fix_provider = agentry

# codex via agentry: ChatGPT subscription, gpt-image-2. Draws the strips.
# comic.py starts agentry itself on port 8770 if nothing answers there.
[agentry]
type = openai_images
base_url = http://localhost:8770/v1
autostart = true
agentry_dir = ../agentry
agentry_args = -Backend codex -Model gpt-6-sol -ReasoningEffort low
autostart_timeout = 120
image_model = gpt-image-2
size = 1024x1536
edit = true
max_refs = 5
timeout = 900

# Grok via agentry: SuperGrok subscription. Draws strips panel by panel
# (comic.py new --panels) and makes the film (video.py). Port 8766.
[grok-agentry]
type = openai_images
base_url = http://localhost:8766/v1
autostart = true
agentry_dir = ../agentry
agentry_args = -Backend grok
autostart_timeout = 120
image_model = grok
size = 1024x1536
edit = true
max_refs = 3
timeout = 600
